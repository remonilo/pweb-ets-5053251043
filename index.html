<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Money Manager</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header><h1>Money Manager</h1></header>
    <p id="peringatan"></p>
    <main>
      <section class="Ringkasan">
        <div class="Box-Ringkasan">
          <div class="Pemasukan">
            <p>Pemasukan</p>
            <p id="total-pemasukan">Rp 0</p>
          </div>

          <div class="Pengeluaran">
            <p>Pengeluaran</p>
            <p id="total-pengeluaran">Rp 0</p>
          </div>

          <div class="Nominal">
            <p>Saldo</p>
            <p id="total-nominal">Rp 0</p>
          </div>
          <div class="Uang-Bulanan">
            <p>Uang Bulanan</p>
            <p id="total-bulanan">Rp 0</p>
          </div>

          <div class="Jatah-Harian">
            <p>Jatah Harian</p>
            <p id="total-harian">Rp 0</p>
          </div>
        </div>
      </section>

      <section>
        <form id="form-input">
          <fieldset id="tipe-pilihan">
            <legend>Tipe</legend>
            <label>
              <input type="radio" name="tipe" value="keluar" checked />
              Pengeluaran
            </label>
            <label>
              <input type="radio" name="tipe" value="masuk" />
              Pemasukan
            </label>
            <label>
              <input type="radio" name="tipe" value="bulanan" />
              Uang Bulanan
            </label>
          </fieldset>

          <div class="field">
            <label for="desc">Deskripsi</label>
            <input type="text" id="desc" autocomplete="off" />
          </div>

          <div class="field">
            <label for="nominal">Nominal</label>
            <input type="number" id="nominal" min="1000" step="1000" />
          </div>

          <div class="field">
            <label for="kategori">Kategori</label>
            <select id="kategori">
              <option>Makanan</option>
              <option>Transportasi</option>
              <option>Pendidikan</option>
              <option>Hiburan</option>
              <option>Tagihan</option>
              <option>Lainnya</option>
            </select>
          </div>

          <div class="field">
            <label for="tanggal">Tanggal</label>
            <input type="date" id="tanggal" />
          </div>

          <p id="error-form"></p>
          <button type="submit">Submit</button>
        </form>
      </section>

      <section>
        <h2 id="judul-list">Riwayat</h2>

        <table id="tabel-masuk" hidden>
          <thead>
            <tr>
              <th scope="col">Tanggal</th>
              <th scope="col">Deskripsi</th>
              <th scope="col">Katagori</th>
              <th scope="col">Nominal</th>
              <th scope="col">
                <span class="visually-hidden"> Aksi </span>
              </th>
            </tr>
          </thead>
          <tbody id="baris-tabel"></tbody>
        </table>
      </section>
    </main>
  </body>
</html>
